name: Checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  package-lock-check:
    name: 🔒 Package lock check
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
        with:
          skip-install: 'true'
      - name: Install NPM dependencies
        run: npm install --ignore-scripts
      - name: Check files are up-to-date
        uses: ./.github/actions/checkFileChanges

  prettier:
    name: 💅 Prettier
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Restore Prettier cache
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/prettier/.prettier-cache
          key: prettier-${{ github.run_id }}
          restore-keys: prettier-
      - name: Run Prettier
        run: npm run prettierCheck
      - name: Check files are up-to-date
        uses: ./.github/actions/checkFileChanges

  lint:
    name: 👔 ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Restore ESLint cache
        uses: actions/cache@v5
        with:
          path: .eslintcache
          key: eslint-${{ github.run_id }}
          restore-keys: eslint-
      - name: Run ESLint
        run: npm run lint -- --cache-strategy content

  knip:
    name: ✂️ Knip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Restore Knip cache
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/knip
          key: knip-${{ github.run_id }}
          restore-keys: knip-
      - name: Run Knip
        run: npm run knip -- --cache
      - name: Run Knip in strict production mode
        run: npm run knip -- --cache --production --strict

  ts:
    name: 😎 TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ./.github/actions/setup
      - name: Restore TypeScript cache
        uses: actions/cache@v5
        with:
          path: tsconfig.tsbuildinfo
          key: ts-${{ github.run_id }}
          restore-keys: ts-
      - name: Check TypeScript
        run: npm run ts

  playwright:
    name: 🖥️ Playwright
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Get installed Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
      - name: Install NPM dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
        shell: bash
      - name: Cache playwright binaries
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install Playwright dependencies
        run: npx playwright install-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Build the project
        run: npm run build
        env:
          # This is used for disabling Vercel tracking in CI
          VITE_CI: true
      - name: Run Playwright tests
        run: npx playwright test --update-snapshots
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Commit updated screenshots
        uses: stefanzweifel/git-auto-commit-action@v7
        id: commit-screenshots
        with:
          commit_message: |
            🤖📸 UPDATE SCREENSHOTS

            PLEASE MERGE THIS COMMIT MANUALLY INTO THE ONE THAT CAUSED IT
          file_pattern: 'tests/*'
      - name: Find screenshot Comment
        uses: peter-evans/find-comment@v4
        id: find-screenshot-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Screenshots have been automatically updated in this PR.
        # Since this is supposed to update a PR comment, this step only makes
        # sense on a PR.
        if: github.event_name == 'pull_request'
      - name: Add updated screenshot comment
        if: github.event_name == 'pull_request' && steps.commit-screenshots.outputs.changes_detected == 'true'
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-screenshot-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: 🤖📸 Screenshots have been automatically updated in this PR. **Please review manually.** After reviewing merge the screenshot commit into the commit that caused the screenshot change.
          edit-mode: replace
      - name: Fail test if screenshots have changed
        if: github.event_name == 'pull_request' && steps.commit-screenshots.outputs.changes_detected == 'true'
        run: exit 1
